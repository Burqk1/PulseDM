name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$want" != "$have" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $have (run: npm run release -- $want)"
            exit 1
          fi

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Pulse DM ${{ github.ref_name }}
          releaseBody: See the assets below to download and install this version.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json

      - name: Firefox extension
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          node scripts/build-firefox.mjs
          npx web-ext lint -s target/firefox-extension --warnings-as-errors=false
          if [ -n "$WEB_EXT_API_KEY" ]; then
            npx web-ext sign -s target/firefox-extension -a target/xpi --channel unlisted --approval-timeout 900000
          else
            echo "::warning::AMO_JWT_ISSUER/AMO_JWT_SECRET not set; the Firefox extension is not signed"
            npx web-ext build -s target/firefox-extension -a target/xpi --overwrite-dest
          fi
          cp "$(ls target/xpi/*.xpi target/xpi/*.zip 2>/dev/null | head -1)" target/pulse-dm-firefox.xpi
          gh release upload "$GITHUB_REF_NAME" target/pulse-dm-firefox.xpi --clobber
