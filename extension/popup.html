<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Pulse DM</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/32.png" alt="" width="20" height="20" />
      <b>Pulse DM</b>
      <span id="status" class="status">…</span>
    </header>

    <label class="row toggle">
      <span data-i18n="captureDownloads"></span>
      <input type="checkbox" id="enabled" />
    </label>
    <p class="muted hint" data-i18n-html="videoHint"></p>

    <button id="bypass" class="secondary" data-i18n="bypass"></button>

    <details>
      <summary data-i18n="settings"></summary>
      <label><span data-i18n="extensionsToCapture"></span> <span class="muted" data-i18n="emptyAll"></span>
        <textarea id="extensions" rows="3"></textarea>
      </label>
      <label><span data-i18n="minSize"></span>
        <input type="number" id="minSizeMb" min="0" step="1" />
      </label>
      <button id="save" data-i18n="save"></button>
    </details>

    <script type="module" src="popup.js"></script>
  </body>
</html>
